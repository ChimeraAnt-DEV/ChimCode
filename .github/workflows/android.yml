name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

jobs:
  build:
    name: Build debug and release APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Verify asset paths and icons
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          python3 tools/check_assets.py
          node tools/test_local_backend.js

      - name: Regenerate launcher icons
        run: python3 android/tools/make_android_icons.py

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: chimcode-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: chimcode-release-apk
          path: android/app/build/outputs/apk/release/*.apk
